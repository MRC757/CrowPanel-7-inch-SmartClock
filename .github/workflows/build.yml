name: Build Firmware

# Compiles the firmware on every push/PR so a broken build gets caught here
# instead of being discovered the next time someone tries to flash the device.
# No real secrets are used or required — it builds against
# include/secrets.h.example (placeholder, empty keys), copied into place as
# include/secrets.h for the build only. See include/secrets.h.example for why
# empty keys are safe to build with.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO core + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Provide placeholder secrets.h (no real keys — see the file for why)
        run: cp include/secrets.h.example include/secrets.h

      - name: Build firmware
        run: pio run
